# RAG-MCP CI/CD Pipeline
# Runs on every push and pull request to main branch
# Stages: Lint → Test → Docker Build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Stage 1: Code Quality ───
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Run ruff linter
        run: ruff check scripts/ tests/ --output-format=github
      
      - name: Run ruff formatter check
        run: ruff format --check scripts/ tests/

  # ─── Stage 2: Unit Tests ───
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install pytest httpx

      - name: Seed test database
        run: |
          uv run python sql.py

      - name: Run MCP server tests
        run: uv run pytest tests/test_mcp_server.py -v --tb=short

      - name: Run API tests
        run: uv run pytest tests/test_api.py -v --tb=short

      - name: Run all tests with coverage summary
        run: |
          uv run pip install pytest-cov
          uv run pytest tests/ -v --tb=short --cov=scripts --cov-report=term-missing

  # ─── Stage 3: Docker Build ───
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was built
        run: docker images rag-mcp:test
